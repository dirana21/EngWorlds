<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta
      name="description"
      content="Мінімалістичні картки для вивчення англійських слів з перекладом і вимовою."
    />
    <title>Wordly — англійські слова</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Wordly — на головну">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>wordly</span>
        </a>
        <div class="top-actions">
          <button class="icon-button" id="shuffleButton" type="button" aria-label="Перемішати слова" title="Перемішати">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="icon-button" id="resetButton" type="button" aria-label="Почати спочатку" title="Почати спочатку">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
          </button>
        </div>
      </header>

      <nav class="mode-switch" aria-label="Режим навчання">
        <button class="mode-button is-active" type="button" data-mode="cards" aria-pressed="true">Картки</button>
        <button class="mode-button" type="button" data-mode="quiz" aria-pressed="false">Тест</button>
      </nav>

      <section class="study-header" aria-labelledby="deckTitle">
        <div>
          <p class="eyebrow">Каталог</p>
          <button class="deck-name-button" id="renameDeckButton" type="button" aria-label="Перейменувати каталог">
            <h1 id="deckTitle">Біологія 1</h1>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l3.5-.7L19 7.8a2.1 2.1 0 0 0-3-3L4.7 16.2 4 20Z"/></svg>
          </button>
          <p class="deck-size"><span id="deckSize">40</span> слів</p>
        </div>
        <div class="counter" aria-live="polite"><span id="currentNumber">1</span><span class="counter-muted"> / </span><span id="totalNumber">40</span></div>
      </section>

      <div class="progress-track" aria-label="Прогрес колоди">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div id="cardsPanel">
        <section class="card-area" aria-label="Картка зі словом">
          <button class="flashcard" id="flashcard" type="button" aria-describedby="cardHint">
            <span class="card-face card-front">
              <span class="card-label" id="partOfSpeech">Noun</span>
              <span class="word" id="englishWord">Cell</span>
              <span class="tap-hint">Натисніть, щоб перевірити</span>
            </span>

            <span class="card-face card-back">
              <span class="card-label">Українською</span>
              <span class="translation" id="ukrainianWord">Клітина</span>
              <span class="pronunciation" id="pronunciation">[сел]</span>
              <span class="divider" aria-hidden="true"></span>
              <span class="english-small" id="englishWordBack">Cell</span>
            </span>
          </button>
          <p class="sr-only" id="cardHint">Натисніть картку, щоб побачити переклад</p>
        </section>

        <section class="controls" aria-label="Керування навчанням">
          <button class="secondary-button" id="speakButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>
            <span>Слухати</span>
          </button>
          <button class="primary-button" id="nextButton" type="button">
            <span>Наступне слово</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </section>

        <p class="keyboard-hint"><kbd>Space</kbd> перевернути · <kbd>→</kbd> далі</p>
      </div>

      <section class="quiz-panel" id="quizPanel" aria-label="Тест зі словами" hidden>
        <div class="quiz-card">
          <div class="quiz-meta">
            <span class="quiz-type" id="quizType">Noun</span>
            <span class="score-pill">Правильно: <span id="quizScore">0</span></span>
          </div>
          <p class="quiz-prompt">Оберіть правильне слово</p>
          <p class="quiz-sentence" id="quizSentence">Programmed cell death is called _____.</p>
          <p class="quiz-translation">Підказка: <strong id="quizTranslation">апоптоз</strong></p>

          <div class="quiz-choices" id="quizChoices" role="group" aria-label="Варіанти відповіді"></div>
          <div class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite" hidden></div>
          <button class="primary-button quiz-next" id="quizNext" type="button" hidden>Наступне завдання</button>
        </div>
      </section>
    </main>

    <dialog class="rename-dialog" id="renameDialog">
      <form class="rename-form" id="renameForm">
        <button class="dialog-close" id="closeDialogButton" type="button" aria-label="Закрити">×</button>
        <p class="eyebrow">Налаштування</p>
        <h2>Назва каталогу</h2>
        <label for="deckNameInput">Нова назва</label>
        <input id="deckNameInput" name="deckName" maxlength="40" autocomplete="off" required />
        <div class="dialog-actions">
          <button class="secondary-button" id="cancelRenameButton" type="button">Скасувати</button>
          <button class="primary-button" type="submit">Зберегти</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=4"></script>
  </body>
</html>

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta
      name="description"
      content="Мінімалістичні картки для вивчення англійських слів з перекладом і вимовою."
    />
    <title>Wordly — англійські слова</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Wordly — на головну">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>wordly</span>
        </a>
        <div class="top-actions">
          <button class="icon-button" id="shuffleButton" type="button" aria-label="Перемішати слова" title="Перемішати">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="icon-button" id="resetButton" type="button" aria-label="Почати спочатку" title="Почати спочатку">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
          </button>
        </div>
      </header>

      <section class="study-header" aria-labelledby="deckTitle">
        <div>
          <p class="eyebrow">Колода</p>
          <h1 id="deckTitle">Біологія 1</h1>
        </div>
        <div class="counter" aria-live="polite"><span id="currentNumber">1</span><span class="counter-muted"> / </span><span id="totalNumber">10</span></div>
      </section>

      <div class="progress-track" aria-label="Прогрес колоди">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <section class="card-area" aria-label="Картка зі словом">
        <button class="flashcard" id="flashcard" type="button" aria-describedby="cardHint">
          <span class="card-face card-front">
            <span class="card-label">English</span>
            <span class="word" id="englishWord">Cell</span>
            <span class="tap-hint">Натисніть, щоб перевірити</span>
          </span>

          <span class="card-face card-back">
            <span class="card-label">Українською</span>
            <span class="translation" id="ukrainianWord">Клітина</span>
            <span class="pronunciation" id="pronunciation">[сел]</span>
            <span class="divider" aria-hidden="true"></span>
            <span class="english-small" id="englishWordBack">Cell</span>
          </span>
        </button>
        <p class="sr-only" id="cardHint">Натисніть картку, щоб побачити переклад</p>
      </section>

      <section class="controls" aria-label="Керування навчанням">
        <button class="secondary-button" id="speakButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>
          <span>Слухати</span>
        </button>
        <button class="primary-button" id="nextButton" type="button">
          <span>Наступне слово</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </section>

      <p class="keyboard-hint"><kbd>Space</kbd> перевернути · <kbd>→</kbd> далі</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
